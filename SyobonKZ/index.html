<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;

            background: rgb(164,179,245);

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameContainer {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        #gameContainer:fullscreen {
            width: 100vw;
            height: 100vh;
            background: rgb(164,179,245);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer:fullscreen #gameCanvas {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        #gameCanvas {
            display: block;
            border: none;
        }

        #fullscreenBtn {
            margin-top: 10px;
        }

        #fullTabHint {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            padding: 8px 16px;
            border-radius: 6px;

            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-family: sans-serif;
            font-size: 14px;

            display: none;
            z-index: 10000;
        }

        #sourcecodelinkkz {
            color: rgb(242,156,56);
            text-shadow:
            -1px -1px 0 black,
            0px -1px 0 black,
            1px -1px 0 black,
            -1px  0px 0 black,
            0px  0px 0 black,
            1px  0px 0 black,
            -1px  1px 0 black,
            0px  1px 0 black,
            1px  1px 0 black;
        }

        #notsourcelink {
            color: rgb(114, 114, 114);
            text-shadow:
            -1px -1px 0 black,
            0px -1px 0 black,
            1px -1px 0 black,
            -1px  0px 0 black,
            0px  0px 0 black,
            1px  0px 0 black,
            -1px  1px 0 black,
            0px  1px 0 black,
            1px  1px 0 black;
        }

        #touchControls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;

            display: none;
            justify-content: space-between;
            align-items: flex-end;

            padding: 0 20px;
            box-sizing: border-box;

            z-index: 10001;
            pointer-events: none;
        }

        #leftSide,
        #rightSide {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(2, 90px);
            gap: 1.5vmin;
            pointer-events: auto;
        }

        #touchControls button {
            width: 100%;
            height: 100%;

            border: none;
            border-radius: 5%;

            background: rgba(255, 255, 255, 0.5);
            color: white;

            font-size: 50px;
            font-weight: bold;

            touch-action: none;
            user-select: none;
        }

        .fullscreenButtonsDesktop {
            display: block;
        }

        .playButtonMobile {
            display: none;
        }

        .playButtonMobile button {
            font-size: 10vw;
            padding: 12px 30px;
            border-radius: 999px;
            color: rgb(242,156,56);
            text-shadow:
            -1px -1px 0 black,
            0px -1px 0 black,
            1px -1px 0 black,
            -1px  0px 0 black,
            0px  0px 0 black,
            1px  0px 0 black,
            -1px  1px 0 black,
            0px  1px 0 black,
            1px  1px 0 black;
        }

        @media (pointer: coarse) {
            #sourcecodelinkkz {
                font-size: x-large;
            }

            #notsourcelink {
                font-size: x-large;
            }

            #gameCanvas {
                display: none;
            }

            #touchControls {
                display: none;
            }

            .fullscreenButtonsDesktop {
                display: none;
            }

            .playButtonMobile {
                display: block;
            }
        }
    </style>
</head>
<body>

<img style="width: 100%; max-width: fit-content;" src="./logo.png"/>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="touchControls">
        <div id="leftSide">
            <button id="leftBtn">◀</button>
            <div></div>
            <button id="rightBtn">▶</button>

            <div></div>
            <button id="downBtn">▼</button>
            <div></div>
        </div>

        <div id="rightSide">
            <div></div>
            <div></div>
            <button id="jumpBtn">▲</button>
        </div>
    </div>
</div>
<div id="fullTabHint">Press Esc to exit Full Tab</div>
<br>
<div class="fullscreenButtonsDesktop">
    <button id="fullscreenBtn">Fullscreen</button>
    <button id="fullTabBtn">Full Tab</button>
</div>
<div class="playButtonMobile">
    <button id="playButtonMobileBtn" onclick="startGameMobile()">Play!</button>
</div>
<br>

<script>
const container = document.getElementById('gameContainer');
const canvas = document.getElementById('gameCanvas');
const fullTabBtn = document.getElementById('fullTabBtn');
const hint = document.getElementById('fullTabHint');

function startGameMobile() {
    canvas.style.display = "block";
    document.getElementById('playButtonMobileBtn').innerText = "Return to game";
    document.getElementById('touchControls').style.display = "flex";
    enterFullscreenAndRotate();
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    console.log("Exited fullscreen");

    canvas.style.display = "none";
    document.getElementById('touchControls').style.display = "none";
    exitFullscreenAndUnlock();
  }
});

async function enterFullscreenAndRotate() {

    try {
        if (!document.fullscreenElement) {
            await container.requestFullscreen();
        }
    } catch (e) {
        console.log("Fullscreen failed:", e);
    }

    try {
        if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
        }
    } catch (e) {
        console.log("Orientation lock failed (not fatal):", e);
    }
}

async function exitFullscreenAndUnlock() {
    try {
        if (document.fullscreenElement) {
            await document.exitFullscreen();
        }

        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }
    } catch (err) {
        console.log(err);
    }
}

document.getElementById('fullscreenBtn').addEventListener('click', async () => {
    try {
        if (!document.fullscreenElement) {
            await enterFullscreenAndRotate();
        } else {
            await exitFullscreenAndUnlock();
        }
    } catch (err) {
        console.error('Fullscreen error:', err);
    }
});

let fullTab = false;
hint.style.display = 'none';

function enterFullTab() {
    fullTab = true;

    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100vw';
    canvas.style.aspectRatio = '480/420';
    canvas.style.objectFit = 'contain';
    canvas.style.height = '100vh';
    canvas.style.zIndex = '9999';

    hint.style.display = 'block';

    fullTabBtn.textContent = 'Exit Full Tab';

    hint.style.display = 'block';
    setTimeout(() => {
        if (fullTab) {
            hint.style.display = 'none';
        }
    }, 3000);
}

function exitFullTab() {
    fullTab = false;

    canvas.style.position = '';
    canvas.style.top = '';
    canvas.style.left = '';
    canvas.style.width = '';
    canvas.style.height = '';
    canvas.style.zIndex = '';

    hint.style.display = 'none';

    fullTabBtn.textContent = 'Full Tab';
}

fullTabBtn.addEventListener('click', () => {
    if (fullTab) {
        exitFullTab();
    } else {
        enterFullTab();
    }
});

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && fullTab) {
        exitFullTab();
    }
});

window.Module = {
    canvas,

    locateFile(path) {
        return path;
    },

    print(text) {
        console.log(text);
    },

    printErr(text) {
        console.error(text);
    }
};


function sendKey(type, keyCode) {
    canvas.focus();

    const event = document.createEvent("KeyboardEvent");

    event.initKeyboardEvent(
        type,
        true,
        true,
        window,
        "",              // key
        0,
        "",              // location
        false,
        false,
        false,
        false
    );

    Object.defineProperty(event, "keyCode", { value: keyCode });
    Object.defineProperty(event, "which", { value: keyCode });

    console.log(type + " " + keyCode);
    canvas.dispatchEvent(event);
}

function bindTouch(btn, keyCode) {

    function press(e) {
        e.preventDefault();
        sendKey('keydown', keyCode);
    }

    function release(e) {
        e.preventDefault();
        sendKey('keyup', keyCode);
    }

    // Mobile
    btn.addEventListener('touchstart', press);
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);

    // Desktop, for testing
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
}

bindTouch(
    document.getElementById('leftBtn'),
    37 //Left key
);

bindTouch(
    document.getElementById('rightBtn'),
    39 //Right key
);

bindTouch(
    document.getElementById('downBtn'),
    40 //Down key
);

bindTouch(
    document.getElementById('jumpBtn'),
    90 //Z key
);
</script>

<script src="./SyobonAction.js"></script>

</body>
</html>
