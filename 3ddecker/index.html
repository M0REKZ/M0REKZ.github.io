<!DOCTYPE html>
<html>
<head>
    <style>
        #game-container {
            width: 100%;
            aspect-ratio: 640 / 380;
            overflow: hidden;
        }

        #game-container iframe {
            display: block;
            width: 640px;
            height: 380px;
            border: 0;
            transform-origin: top left;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <iframe
            src="DeckRaycaster.html"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>

    <br><br><br>

    <p style="text-align: center;">
        <a href="https://m0rekz.itch.io/decker-raycaster-by-kz">
            <img src="./img/badge.svg"
                 alt="Page on itch.io"
                 style="width: 200px;">
        </a>
    </p>

    <script>
        function resizeGame() {
            const container = document.getElementById("game-container");
            const iframe = container.querySelector("iframe");

            const scale = container.clientWidth / 640;

            iframe.style.transform = "scale(" + scale + ")";
        }

        window.addEventListener("resize", resizeGame);
        resizeGame();
    </script>

</body>
</html>
